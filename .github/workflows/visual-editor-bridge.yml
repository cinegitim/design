name: Visual Editor bridge
on:
  pull_request:
    paths:
      - "studio/visual-editor/**"
      - "docs/visual-editor/**"
      - "docs/workspaces/asyada-egitim/index.html"
      - "docs/index.html"
      - "docs/instagram/index.html"
      - ".github/workflows/visual-editor-bridge.yml"
  push:
    branches: [main]
    paths:
      - "studio/visual-editor/**"
      - "docs/visual-editor/**"
      - ".github/workflows/visual-editor-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify optional bridge, immutable product checks and Pages entrypoints
        run: python3 -I -B -m unittest discover -s studio/visual-editor/tests -v
