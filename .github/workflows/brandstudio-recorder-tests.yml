name: Brandstudio production recorder tests

on:
  pull_request:
    paths:
      - "studio/production/**"
      # Exclude completed product packages; they have their own bounded review.
      - "!studio/production/finalized/**"
      - "docs/system/**"
      - "docs/index.html"
      - "docs/workspaces/asyada-egitim/index.html"
      - "docs/visual-editor/browser/style-registry.json"
      - "brands/asyada-egitim/styles/**"
      - ".github/workflows/brandstudio-recorder-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout only tested sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            studio/production/
            docs/system/
            docs/index.html
            docs/workspaces/asyada-egitim/index.html
            docs/visual-editor/browser/style-registry.json
            brands/asyada-egitim/brand.json
            brands/asyada-egitim/styles/
            brands/asyada-egitim/assets/lockups/
            brands/asyada-egitim/assets/v01-canonical.svg
          sparse-checkout-cone-mode: false
      - name: Python interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated P1 schema validator for test suite
        run: python3 -m pip install -r studio/production/contracts/requirements.txt
      - name: Execute existing and P1 offline production tests
        run: python3 -m unittest discover -s studio/production/tests -v
      - name: Fail closed if public system catalog differs from canonical GitHub sources
        run: python3 studio/production/public_catalog.py --check
