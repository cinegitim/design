name: Brandstudio Pages — manual zero-cost deployment

# Never runs automatically: prevent unbounded free-tier build usage.
on:
  workflow_dispatch:
  # One explicitly committed marker is an alternative to pressing Run workflow.
  # Editing designs never triggers a build. Change only this marker to deploy.
  push:
    branches: [main]
    paths:
      - ".github/brandstudio-pages-deploy-marker.txt"

permissions:
  contents: read

concurrency:
  group: brandstudio-pages-manual
  cancel-in-progress: false

jobs:
  static-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Enforce zero-cost policy and immutable identity
        run: |
          python3 studio/cloudflare-brandstudio/check_free_only.py
          python3 -I -B -m unittest discover -s studio/cloudflare-brandstudio/tests -p 'test_*.py' -v
      - name: Assemble standalone Pages static assets
        run: python3 studio/cloudflare-brandstudio/build_pages.py
      - name: Verify Pages token is present (no value logged)
        env:
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$CF_PAGES_TOKEN" ]; then
            echo "::error::CLOUDFLARE_PAGES_DEPLOY_TOKEN is missing. Create a Pages Edit scoped token for personal Cloudflare account only."
            exit 1
          fi
      - name: Deploy only public static assets to personal Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: b462aa1499215378fe7f671a788c8a3c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy studio/cloudflare-brandstudio/dist \
            --project-name brandstudio-migration \
            --branch main \
            --commit-hash "$GITHUB_SHA"
