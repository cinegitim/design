<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Brandstudio · Tasarım Editörü</title><script>if(location.hostname==='cinegitim.github.io'){location.replace('https://studio.asyadaegitim.com'+(location.pathname.startsWith('/design/')?location.pathname.slice(7):location.pathname)+location.search+location.hash)}</script>
<meta name="description" content="Mevcut ve yeni tasarımları tarayıcıda aç, düzenle ve sürümlerini kaydet.">
<style>
*{box-sizing:border-box}body{min-height:100dvh;display:grid;place-items:center;margin:0;background:#111923;color:#e8edf3;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Inter",sans-serif}
main{width:min(460px,calc(100vw - 40px));background:#1a2633;border:1px solid #334457;padding:32px;border-radius:16px}
h1{font-weight:720;font-size:24px;letter-spacing:-.04em;margin:0 0 9px}p{color:#aab5c3;margin:0 0 23px}
a{display:inline-flex;justify-content:center;align-items:center;color:#fff;text-decoration:none;background:#bd4334;padding:11px 16px;border-radius:8px;font-weight:650}
a:focus-visible{outline:2px solid #efba86;outline-offset:4px}
</style></head><body><main><h1>Brandstudio</h1><p>Tasarımların düzenleme alanı tarayıcıda açılıyor. Düzenlemelerin otomatik kaydedilir. Tasarımlarını buradan açabilir ve dışa aktarabilirsin.</p>
<a id="continue" href="browser/">Tarayıcı editörüne geç</a></main>
<script>
(function(){
 var params=new URLSearchParams(location.search),product=params.get('product');
 var target=new URL('browser/',location.href);
 if(product&&/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(product))target.searchParams.set('product',product);
 document.getElementById('continue').href=target.href;
 location.replace(target.href);
})();
</script></body></html>
