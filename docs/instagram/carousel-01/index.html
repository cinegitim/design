<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Üniversite için başka bir dünya var. — Carousel 01</title><style>@font-face{font-family:Jost;src:url(assets/Jost-VF.ttf);font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#D8D2C7;color:#1D2027;font:17px/1.5 Jost,Arial,sans-serif}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:clamp(42px,7vw,78px);line-height:1.02;max-width:900px}h2{font-size:32px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.row img{width:100%;box-shadow:0 4px 14px #1D202733}.slide{display:grid;grid-template-columns:minmax(0,650px) 1fr;gap:28px;align-items:center;margin:44px 0}.slide img{width:100%;box-shadow:0 6px 24px #1D202733}.small{width:160px!important}.badge{color:#BD2120;font-weight:600}a{color:inherit}@media(max-width:700px){main{padding:18px}.row{grid-template-columns:repeat(2,1fr)}.slide{grid-template-columns:1fr}.small{width:135px!important}}</style><main><p class="badge">ASYA’DA EĞİTİM · INSTAGRAM CAMPAIGN 01</p><h1>Üniversite için<br>başka bir dünya var.</h1><p>Beş slayt · Jost üretim tipografisi · Kanonik SVG imzaları · AI fotoğraf plakaları + editlenebilir HTML/CSS.</p><p><a href="sequence.jpg">Beşli sıralı görünüm</a> · <a href="feed-preview.jpg">Kapak feed önizlemesi</a> · <a href="manifest.json">Asset manifestosu</a></p><h2>Tüm carousel</h2><div class="row"><img src="01-cover.png"><img src="02-shift.png"><img src="03-routes.png"><img src="04-pathways.png"><img src="05-cta.png"></div><div id="slides"></div><script>const files=['01-cover.png','02-shift.png','03-routes.png','04-pathways.png','05-cta.png'];const names=['01 · Hook','02 · Fikir değişimi','03 · Beş rota','04 · Eğitim yolları','05 · CTA / marka kapanışı'];document.getElementById('slides').innerHTML=files.map((f,i)=>`<section class="slide"><a href="${f}"><img src="${f}" alt="${names[i]}"></a><div><p class="badge">${names[i]}</p><a href="source/0${i+1}.html">Düzenlenebilir HTML/CSS kaynağı</a><p><a href="${f}" download>PNG indir · 1080×1350</a></p></div></section>`).join('')+`<h2>Mobil kapak önizlemesi</h2><img class="small" src="01-cover.png" alt="Mobil ölçekte kapak">`;</script></main></html>
