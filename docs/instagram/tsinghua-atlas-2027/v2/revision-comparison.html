<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tsinghua Atlası · V1 / V2 karşılaştırması</title>
<style>@font-face{font-family:Jost;src:url(assets/Jost-VF.ttf);font-weight:100 900}*{box-sizing:border-box}body{margin:0;padding:26px;background:#D8D2C7;color:#1D2027;font:15px/1.4 Jost,Arial,sans-serif}header{max-width:1300px;margin:0 auto 18px}h1{font-size:34px;line-height:1;margin:6px 0}.kicker{color:#BD2120;font-weight:700;letter-spacing:.13em}.row{max-width:1300px;margin:0 auto 12px;background:#F7F3E9;padding:10px;display:grid;grid-template-columns:100px 1fr 1fr;gap:14px;align-items:start}.row img{display:block;width:100%;height:auto}.tag{font-weight:700;letter-spacing:.1em;font-size:12px;margin:0 0 5px}.slide{font-weight:700;letter-spacing:.07em}.note{color:#58534b;font-size:13px}</style>
<header><div class="kicker">V1 → V2 · YAN YANA İNCELEME</div><h1>Değişen düzen, aynı yedi parçalı akış</h1><p class="note">V1 arşivde, V2 ayrı sürüm klasöründe. Yedi slayttaki görsel değişiklikler yan yana gösterilir.</p></header><main id="rows"></main>
<script>const labels=['Kapak','Alan sıralamaları','Küresel sıralamalar','İngilizce + HSK','Başvuru takvimi','Ücret + burs','Asya’da Eğitim CTA'];document.querySelector('#rows').innerHTML=labels.map((label,i)=>{const n=String(i+1).padStart(2,'0');return `<section class="row"><div class="slide">${n}<br>${label}</div><div><div class="tag">V1 · ARŞİV</div><img src="../png/${n}.png" alt="V1 ${label}"></div><div><div class="tag">V2 · İNCELEME</div><img src="png/${n}.png" alt="V2 ${label}"></div></section>`}).join('');</script></html>
