<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İlk render / güncellenmiş render karşılaştırması</title>
<style>@font-face{font-family:Jost;src:url(assets/Jost-VF.ttf);font-weight:100 900}*{box-sizing:border-box}body{margin:0;padding:24px;background:#D8D2C7;color:#1D2027;font:15px/1.4 Jost,Arial,sans-serif}h1{font-size:30px;margin:0 0 14px}.row{display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;align-items:start;margin:12px auto;max-width:1320px;background:#F7F3E9;padding:10px}.row img{display:block;width:100%;height:auto}.label{font-weight:700;letter-spacing:.08em}.small{color:#6C675F;font-size:12px}</style>
<h1>Render karşılaştırması · ilk ve güncellenmiş çıktı</h1><p class="small">İlk V2 renderı ile kapak/kapanış dipnotları kaldırıldıktan sonraki 1080 × 1350 PNG çıktıları.</p>
<div id="rows"></div><script>const ids=['01-cover','02-subject-rankings','03-global-rankings','04-english-hsk','05-deadlines','06-tuition-scholarships','07-cta'];document.querySelector('#rows').innerHTML=ids.map((id,i)=>`<section class="row"><div><div class="label">${String(i+1).padStart(2,'0')}</div><div class="small">${id}</div></div><div><div class="label">İLK RENDER</div><img src="originals/${String(i+1).padStart(2,'0')}.png"></div><div><div class="label">GÜNCELLENMİŞ RENDER</div><img src="png/${String(i+1).padStart(2,'0')}.png"></div></section>`).join('');</script></html>
