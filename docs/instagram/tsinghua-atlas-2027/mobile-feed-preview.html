<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tsinghua — Mobil Akış Önizlemesi</title><style>
*{box-sizing:border-box}body{margin:0;background:#D8D2C7;color:#1D2027;font:15px/1.45 Arial,sans-serif}.top{max-width:520px;margin:0 auto;padding:20px 16px 12px}.top a{color:inherit}.top h1{font-size:25px;margin:12px 0 4px}.top p{margin:4px 0;color:#555}.phone{max-width:430px;margin:0 auto 40px;background:#fff;border:10px solid #1D2027;border-radius:28px;overflow:hidden;box-shadow:0 10px 34px #1D202733}.bar{height:48px;background:#fff;display:flex;align-items:center;padding:0 14px;justify-content:space-between;font-weight:700;border-bottom:1px solid #eee}.bar .avatar{width:28px;height:28px;border-radius:50%;background:#BD2120;color:white;display:grid;place-items:center;font-size:12px}.viewport img{display:block;width:100%;height:auto}.tools{display:flex;justify-content:space-between;padding:12px 14px;background:#fff}.tools button{border:0;background:#1D2027;color:white;padding:9px 15px;border-radius:4px;font-weight:700}.tools button:disabled{opacity:.35}.indicators{display:flex;gap:6px;justify-content:center;background:white;padding:0 0 12px}.indicators button{height:7px;width:7px;border-radius:50%;padding:0;border:0;background:#bdbab4}.indicators button.active{background:#BD2120}.caption{padding:0 14px 16px;background:white;font-size:13px}.caption b{margin-right:6px}
</style></head><body><header class="top"><a href="index.html">← Review galerisine dön</a><h1>Mobil akış önizlemesi</h1><p>390 px cihaz çerçevesi · 4:5 görseller · kaydırma kontrolleri kullanılabilir</p></header><main class="phone"><div class="bar"><span>‹</span><span>Gönderi</span><span>•••</span></div><div class="viewport"><img id="slide" src="png/01.png" alt="Tsinghua carousel slayt 1"></div><div class="indicators" id="dots"></div><div class="tools"><button id="prev">← Önceki</button><span id="count" style="align-self:center;font-weight:700">1 / 7</span><button id="next">Sonraki →</button></div><div class="caption"><b>asyadaegitim</b>Tsinghua Üniversitesi: Pekin’de küresel ölçekte bir akademik ekosistem. İncele, kaydet, başvuru takvimini kontrol et.</div></main><script>
const img=document.querySelector('#slide'),count=document.querySelector('#count'),dots=document.querySelector('#dots'),prev=document.querySelector('#prev'),next=document.querySelector('#next');let i=1;for(let n=1;n<=7;n++){const b=document.createElement('button');b.setAttribute('aria-label',`Slayt ${n}`);b.onclick=()=>show(n);dots.append(b)}function show(n){i=Math.max(1,Math.min(7,n));img.src=`png/${String(i).padStart(2,'0')}.png`;img.alt=`Tsinghua carousel slayt ${i}`;count.textContent=`${i} / 7`;prev.disabled=i===1;next.disabled=i===7;[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===i-1))}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});show(1);
</script></body></html>
