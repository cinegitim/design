<!doctype html><html lang="tr"><meta charset="utf-8">
<style>

@font-face {
  font-family: 'Jost';
  src: url('../../assets/Jost-VF.ttf');
  font-weight: 100 900;
  font-style: normal;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  font-family: 'Jost', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.slide {
  position: relative;
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: #101318;
  color: #F7F3E9;
  padding: 68px 76px 56px 76px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.photo {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1350px;
  object-fit: cover;
  object-position: center 46%;
}
.veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(16,19,24,.92) 0%, rgba(16,19,24,.48) 32%, rgba(16,19,24,.75) 65%, rgba(16,19,24,.98) 100%);
}

.top-zone { position: relative; z-index: 3; }
.sid {
  font-size: 30px;
  font-weight: 750;
  letter-spacing: .16em;
  color: #F4E8D3;
  margin-bottom: 34px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sid::before {
  content: '';
  display: inline-block;
  width: 18px;
  height: 4px;
  background: #D9A441;
}

.prehead {
  font-size: 80px;
  font-weight: 750;
  color: #F4E8D3;
  line-height: 1.05;
  letter-spacing: -.02em;
  margin-bottom: 20px;
}

.headline-wrap {
  margin-bottom: 38px;
}
.headline-china {
  font-size: 138px;
  font-weight: 900;
  line-height: 0.88;
  letter-spacing: -.05em;
  color: #DE2910;
  text-shadow: 0 4px 28px rgba(0,0,0,.7);
}
.headline-sub {
  font-size: 90px;
  font-weight: 750;
  line-height: 0.98;
  letter-spacing: -.035em;
  color: #F7F3E9;
}

.response-card {
  position: relative;
  z-index: 3;
  border-left: 10px solid #D9A441;
  padding: 18px 0 18px 32px;
  background: rgba(16,19,24,.55);
  backdrop-filter: blur(10px);
  margin-bottom: 36px;
}
.evet-txt {
  font-size: 78px;
  font-weight: 850;
  color: #D9A441;
  line-height: 1;
  margin-bottom: 12px;
}
.response-desc {
  font-size: 35px;
  font-weight: 550;
  line-height: 1.25;
  color: #F7F3E9;
}

.pillar-strip {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-bottom: 32px;
}
.pillar-card {
  background: rgba(247,243,233,.08);
  border: 1.5px solid rgba(217,164,65,.35);
  padding: 16px 14px;
  text-align: center;
  backdrop-filter: blur(6px);
}
.pillar-tag {
  font-size: 22px;
  font-weight: 750;
  color: #D9A441;
  letter-spacing: .06em;
  margin-bottom: 4px;
}
.pillar-desc {
  font-size: 20px;
  font-weight: 550;
  color: #F4E8D3;
}

.bottom {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-top: 2px solid rgba(247,243,233,.25);
  padding-top: 24px;
}
.tag-block {
  font-size: 35px;
  font-weight: 750;
  color: #F7F3E9;
  letter-spacing: .02em;
}
.tag-sub {
  font-size: 25px;
  font-weight: 500;
  color: rgba(247,243,233,.8);
  margin-top: 5px;
}
.logo {
  width: 250px;
  height: auto;
  display: block;
}
</style>
<body>
<main class="slide">
  <img class="photo" src="../../assets/china-skyline.jpg" alt="">
  <div class="veil"></div>
  
  <div class="top-zone">
    <div class="sid">BAŞVURU REHBERİ / 001</div>
    <div class="prehead">Çince bilmiyorum.</div>
    <div class="headline-wrap">
      <div class="headline-china">Çin'de</div>
      <div class="headline-sub">okuyabilir miyim?</div>
    </div>
    <div class="response-card">
      <div class="evet-txt">Evet.</div>
      <div class="response-desc">Çin'de İngilizce lisans, yüksek lisans ve doktora programları var.</div>
    </div>

    <div class="pillar-strip">
      <div class="pillar-card">
        <div class="pillar-tag">LİSANS</div>
        <div class="pillar-desc">100+ Bölüm Seçeneği</div>
      </div>
      <div class="pillar-card">
        <div class="pillar-tag">YÜKSEK LİSANS</div>
        <div class="pillar-desc">1–3 Yıl · Tezli/Tezsiz</div>
      </div>
      <div class="pillar-card">
        <div class="pillar-tag">DOKTORA</div>
        <div class="pillar-desc">Tam Burs Olanakları</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div>
      <div class="tag-block">İNGİLİZCE EĞİTİM</div>
      <div class="tag-sub">Türkiye'den başvuru mümkün.</div>
    </div>
    <img class="logo" src="../../assets/p-01-primary-stacked-dark.svg" alt="Asya'da Eğitim">
  </div>
</main>
</body></html>
