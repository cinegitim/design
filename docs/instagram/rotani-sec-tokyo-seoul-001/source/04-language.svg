<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>İngilizce okuyabilirsin. Peki yaşayabilir misin?</title><defs><style>@font-face{font-family:Jost;src:url('../assets/Jost-VF.ttf') format('truetype');font-weight:100 900;font-style:normal}text{font-family:Jost,Arial,sans-serif;font-synthesis:none}</style></defs><image href="../originals/04-language.png" x="0" y="0" width="1080" height="1350"/><rect x="813.000" y="48.000" width="220.000" height="96.562" fill="#F7F3E9" opacity=".94"/><g id="editable-campaign-copy" data-exact-copy-json="[&quot;İngilizce okuyabilirsin. Peki yaşayabilir misin?&quot;, &quot;Her iki şehirde de İngilizce lisans seçenekleri var. Ama her program İngilizce değil.&quot;, &quot;JAPONYA&quot;, &quot;Japonca, günlük yaşamını kolaylaştırır.&quot;, &quot;GÜNEY KORE&quot;, &quot;Korece, kampüs dışında önemli bir avantaj sağlar.&quot;, &quot;Başvurmadan önce bölümün öğretim dilini ve dil yeterlilik şartlarını kontrol et.&quot;]"><g data-copy="0"><text x="61.000" y="126.025" font-size="67.000" font-weight="760" letter-spacing="-3.484" fill="#f7f3e9">İngilizce okuyabilirsin.</text><text x="61.000" y="189.005" font-size="67.000" font-weight="760" letter-spacing="-3.484" fill="#d8f457">Peki yaşayabilir misin?</text></g><g data-copy="1"><text x="242.092" y="410.034" font-size="31.000" font-weight="540" letter-spacing="0.000" fill="#1d2027">Her iki şehirde de İngilizce lisans</text><text x="243.389" y="447.234" font-size="31.000" font-weight="540" letter-spacing="0.000" fill="#1d2027">seçenekleri var. Ama her program</text><text x="244.687" y="484.434" font-size="31.000" font-weight="540" letter-spacing="0.000" fill="#1d2027">İngilizce değil.</text></g><g data-copy="2"><text x="88.000" y="711.100" font-size="28.000" font-weight="700" letter-spacing="3.640" fill="#f7f3e9">JAPONYA</text></g><g data-copy="3"><text x="88.000" y="763.175" font-size="29.000" font-weight="530" letter-spacing="0.000" fill="#f7f3e9">Japonca, günlük yaşamını</text><text x="88.000" y="796.815" font-size="29.000" font-weight="530" letter-spacing="0.000" fill="#f7f3e9">kolaylaştırır.</text></g><g data-copy="4"><text x="640.000" y="769.100" font-size="28.000" font-weight="700" letter-spacing="3.640" fill="#f7f3e9">GÜNEY KORE</text></g><g data-copy="5"><text x="640.000" y="821.175" font-size="29.000" font-weight="530" letter-spacing="0.000" fill="#f7f3e9">Korece, kampüs dışında</text><text x="640.000" y="854.815" font-size="29.000" font-weight="530" letter-spacing="0.000" fill="#f7f3e9">önemli bir avantaj sağlar.</text></g><g data-copy="6"><text x="169.375" y="1243.725" font-size="28.000" font-weight="660" letter-spacing="0.000" fill="#1d2027">Başvurmadan önce bölümün öğretim dilini ve dil yeterlilik</text><text x="413.359" y="1275.925" font-size="28.000" font-weight="660" letter-spacing="0.000" fill="#1d2027">şartlarını kontrol et.</text></g></g><image id="canonical-lockup" data-lockup-id="D-04/light" href="../assets/lockups/d-04-small-use-digital-light.svg" x="813.000" y="54.170643" width="220.000" height="84.221213" preserveAspectRatio="xMidYMid meet"/></svg>