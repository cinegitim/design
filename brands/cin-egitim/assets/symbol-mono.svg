  <title id="title">Çin Eğitim — SVG sembol adayı</title>
  <desc id="desc">Son süper çözünürlük PNG'sinden izlenen kırmızı fırça halkası, siyah pagoda ve mürekkep zemini. Yalnız vektör yolları; tipografi yok. İnsan onayı bekliyor.</desc>
