<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Asya'da Eğitim — Eğitim fuarı el ilanı (A5 prototip)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#222;font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
  .sheet{width:148mm;height:210mm;position:relative;overflow:hidden;background:#F7F3E9;color:#1D2027;
    display:flex;flex-direction:column}
  .crest{padding:11mm 0 7mm;text-align:center}
  .crest img.lockup{width:80mm;height:auto}
  h1{font-size:11.5mm;line-height:1.1;font-weight:600;letter-spacing:-.015em;text-align:center;text-wrap:balance}
  .rule{width:22mm;height:1.4mm;background:#BD2120;margin:5mm auto 0}
  .photo{margin:6mm 0 0;height:64mm;background:#1D2027 url("raster/flyer-campus.jpg") center 68%/cover no-repeat}
  .infos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm;padding:7mm 12mm 5mm}
  .infos .k{font-size:3.4mm;font-weight:500;letter-spacing:.18em;color:#BD2120;margin-bottom:1.6mm}
  .infos .v{font-size:4.6mm;line-height:1.35;font-weight:500}
  .infos .v small{display:block;font-weight:400;font-size:3.7mm;opacity:.75}
  .foot{margin-top:auto;background:#BD2120;color:#F7F3E9;text-align:center;padding:6mm 10mm}
  .foot .big{font-size:5.4mm;font-weight:600;letter-spacing:.02em}
  .foot .small{font-size:3.6mm;margin-top:1.6mm;opacity:.92}
</style>
</head>
<body>
<div class="sheet" role="img" aria-label="Asya'da Eğitim eğitim fuarı el ilanı prototipi">
  <div class="crest">
    <img class="lockup" src="../../assets/lockups/f-05-formal-bilingual-light.svg" alt="Asya'da Eğitim — Formal bilingual (F-05/light, kanonik)">
  </div>
  <h1>Eğitim Fuarı&rsquo;ndayız</h1>
  <div class="rule"></div>
  <div class="photo"></div>
  <div class="infos">
    <div><div class="k">TARİH</div><div class="v">18–19 Ekim<small>Cumartesi–Pazar<br>10.00–18.00</small></div></div>
    <div><div class="k">YER</div><div class="v">Kongre Merkezi<small>Salon B<br>Stand 24</small></div></div>
    <div><div class="k">PROGRAM</div><div class="v">Üniversite sunumları<small>11.30 / 14.30<br>Birebir görüşme</small></div></div>
  </div>
  <div class="foot">
    <div class="big">Ücretsiz ön görüşme için standımıza uğrayın</div>
    <div class="small">Kontenjanlar sınırlı</div>
  </div>
</div>
</body>
</html>
