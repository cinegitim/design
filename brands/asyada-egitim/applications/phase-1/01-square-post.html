<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Asya'da Eğitim — Kare sosyal medya gönderisi (prototip)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#222;font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
  .post{width:1080px;height:1080px;position:relative;overflow:hidden;
    background:#1D2027 url("raster/square-courtyard.jpg") center 18%/cover no-repeat}
  .card{position:absolute;left:110px;top:110px;width:860px;height:860px;background:#F7F3E9;
    border-radius:28px;padding:56px 72px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .card img.lockup{width:360px;height:auto;display:block}
  .eyebrow{font-size:24px;font-weight:500;letter-spacing:.22em;color:#BD2120}
  h1{font-size:66px;line-height:1.08;font-weight:600;letter-spacing:-.02em;color:#1D2027;text-wrap:balance}
  .sub{font-size:29px;line-height:1.45;font-weight:400;color:#1D2027;opacity:.82;max-width:640px}
  .cta{display:inline-block;background:#BD2120;color:#F7F3E9;font-size:29px;font-weight:500;
    padding:18px 54px;border-radius:999px;text-decoration:none;letter-spacing:.02em}
  .meta{display:none}
</style>
</head>
<body>
<div class="post" role="img" aria-label="Asya'da Eğitim kare sosyal medya gönderisi prototipi">
  <div class="card">
    <img class="lockup" src="../../assets/lockups/p-01-primary-stacked-light.svg" width="360" alt="Asya'da Eğitim — Primary stacked (P-01/light, kanonik)">
    <div class="eyebrow">SEUL &bull; LİSANS</div>
    <h1>Kampüs hayatın burada başlıyor</h1>
    <p class="sub">Güz dönemi başvuruları açıldı. Üniversite seçimi, başvuru ve vize adımlarında yanındayız.</p>
    <span class="cta">Detaylı bilgi &rarr;</span>
  </div>
</div>
</body>
</html>
