<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Asya'da Eğitim — Dikey kampanya (4:5 prototip)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#222;font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
  .sheet{width:1080px;height:1350px;position:relative;overflow:hidden;
    background:#1D2027 url("raster/vertical-path.jpg") center/cover no-repeat}
  .masthead{position:absolute;left:0;top:0;width:1080px;height:280px;background:#F7F3E9;
    display:flex;align-items:center;gap:40px;padding:0 56px}
  .masthead img.lockup{width:540px;height:auto;display:block;flex:none}
  .masthead .side{margin-left:auto;text-align:right}
  .masthead .tag{font-size:23px;font-weight:500;letter-spacing:.2em;color:#BD2120}
  .masthead .cta-line{font-size:27px;font-weight:500;color:#1D2027;margin-top:10px}
  .scrim{position:absolute;left:0;bottom:0;width:1080px;height:640px;
    background:linear-gradient(to bottom,rgba(29,32,39,0) 0%,rgba(29,32,39,.55) 38%,rgba(29,32,39,.88) 100%)}
  .copy{position:absolute;left:0;bottom:0;width:1080px;padding:0 72px 72px;color:#F7F3E9}
  .eyebrow{font-size:25px;font-weight:500;letter-spacing:.22em;color:#F7F3E9;opacity:.85}
  .eyebrow b{color:#fff;border-bottom:3px solid #BD2120;padding-bottom:4px}
  h1{font-size:80px;line-height:1.06;font-weight:600;letter-spacing:-.02em;margin:22px 0 18px;text-wrap:balance}
  .sub{font-size:30px;line-height:1.5;font-weight:400;opacity:.9;max-width:820px}
  .cta{display:inline-block;margin-top:30px;background:#BD2120;color:#F7F3E9;font-size:30px;font-weight:500;
    padding:20px 58px;border-radius:999px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="sheet" role="img" aria-label="Asya'da Eğitim dikey kampanya prototipi">
  <div class="masthead">
    <img class="lockup" src="../../assets/lockups/h-02-primary-horizontal-light.svg" width="540" alt="Asya'da Eğitim — Primary horizontal (H-02/light, kanonik)">
    <div class="side">
      <div class="tag">TOKYO</div>
      <div class="cta-line">Yüksek Lisans</div>
    </div>
  </div>
  <div class="scrim"></div>
  <div class="copy">
    <div class="eyebrow"><b>2026</b> &nbsp;GÜZ DÖNEMİ</div>
    <h1>Bir sonraki adımın Asya&rsquo;da</h1>
    <p class="sub">Burs seçenekleri, başvuru takvimi ve kabul koşulları tek görüşmede netleşiyor.</p>
    <span class="cta">Üniversiteleri keşfet &rarr;</span>
  </div>
</div>
</body>
</html>
